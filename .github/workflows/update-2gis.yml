name: Данные 2ГИС

on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-2gis.mjs
      - .github/workflows/update-2gis.yml

permissions:
  contents: write

concurrency:
  group: update-2gis
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Получить рейтинги и адреса из API 2ГИС
        env:
          GIS_KEY: ${{ secrets.GIS_KEY }}
        run: node scripts/update-2gis.mjs reviews.json
      - name: Сохранить, если изменилось
        run: |
          [ -f reviews.json ] || { echo "нет reviews.json"; exit 0; }
          if git ls-files --error-unmatch reviews.json >/dev/null 2>&1 && git diff --quiet -- reviews.json; then
            echo "reviews.json не изменился"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "Обновить данные 2ГИС"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
